<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Professor</title>
<style>body{font-family:Arial;background:#081827;color:#fff;padding:20px}.p{background:#102b3d;padding:15px;margin:8px;border-radius:12px}</style></head><body><h1>👨‍🏫 Painel do Professor — V3</h1><div id="p"></div><script src="/socket.io/socket.io.js"></script><script>const s=io();s.on('players',a=>p.innerHTML=a.sort((x,y)=>y.xp-x.xp).map(x=>`<div class=p><b>${x.name}</b> • Turma ${x.room} — ⭐ ${x.xp} XP</div>`).join(''));</script></body></html>
