<!doctype html><html lang=pt-BR><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MATH SCHOOL 3D V2</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#09151f;color:#fff;font-family:Arial;touch-action:none}canvas{position:fixed;inset:0}.login{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:linear-gradient(#15537d,#07121d)}.card{width:min(450px,92vw);background:#071927ee;padding:22px;border:2px solid #66c5ff;border-radius:22px}.card h1{color:#ffd14a}.card input,.card select,.card button{width:100%;padding:14px;margin:6px 0;border-radius:11px;font-size:17px}.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.avatars button.sel{outline:3px solid white}.go,.action{background:#f6aa26;border:0;font-weight:bold}.hud{position:fixed;z-index:20;left:10px;right:10px;top:10px;display:none;justify-content:space-between;pointer-events:none}.pill{background:#061725e8;padding:9px 13px;border-radius:12px}.joy{position:fixed;z-index:25;left:22px;bottom:24px;width:116px;height:116px;border:2px solid #fff6;background:#fff2;border-radius:50%;display:none}.stick{position:absolute;left:34px;top:34px;width:45px;height:45px;background:#fffb;border-radius:50%}.action{position:fixed;z-index:25;right:22px;bottom:34px;width:94px;height:94px;border-radius:50%;display:none}.hint{position:fixed;z-index:24;left:50%;bottom:135px;transform:translateX(-50%);background:#061725e8;padding:10px 14px;border-radius:10px;display:none;text-align:center}.cross{position:fixed;z-index:20;left:50%;top:50%;display:none;font-size:25px}.modal{position:fixed;inset:0;z-index:50;background:#000c;display:none;align-items:center;justify-content:center}.mb{width:min(480px,92vw);background:#10283b;padding:20px;border:2px solid #f6aa26;border-radius:18px}.opt{width:100%;padding:12px;margin:5px 0;border:0;border-radius:9px;background:#205171;color:#fff}.toast{position:fixed;z-index:70;top:70px;left:50%;transform:translateX(-50%);background:#17613a;padding:11px;border-radius:10px;display:none}.map{position:fixed;z-index:19;right:12px;top:92px;width:112px;background:#061725cc;border-radius:10px;padding:8px;font-size:11px;display:none}.map b{color:#ffd14a}</style></head><body>
<div id=login class=login><div class=card><h1>🏫 MATH SCHOOL 3D • V2</h1><p>Entre pelo portão, explore a escola e escolha sua missão.</p><input id=nm placeholder="NOME DO ALUNO"><select id=tr><option value="">TURMA</option><option>206</option><option>207</option><option>208</option></select><div class=avatars><button>🔵</button><button>🟢</button><button>🟣</button><button>🟠</button></div><button class=go id=go>ENTRAR NA ESCOLA</button><small id=load></small></div></div>
<div id=hud class=hud><div class=pill><b id=who>Aluno</b><br><span id=where>Portaria</span></div><div class=pill>⭐ <b id=xpv>0 XP</b></div></div><div id=map class=map><b>MAPA</b><br>📘 PA — esquerda<br>📗 PG — direita<br>📚 Biblioteca<br>💻 Laboratório<br>🏀 Pátio</div><div id=cross class=cross>+</div><div id=joy class=joy><div id=stick class=stick></div></div><button id=action class=action>AÇÃO</button><div id=hint class=hint></div><div id=toast class=toast></div><div id=modal class=modal><div class=mb><h2 id=mt></h2><p id=mq></p><div id=opts></div><button class=opt id=close>FECHAR</button></div></div>
<script>
let THREE,scene,cam,ren,dir,dirTag,started=false,yaw=0,pitch=0,jx=0,jy=0,xp=0,inter=null,last=0,t=0,avatar=0;const socket=io(),$=x=>document.getElementById(x),walls=[];
document.querySelectorAll('.avatars button').forEach((b,i)=>b.onclick=()=>{avatar=i;document.querySelectorAll('.avatars button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});document.querySelector('.avatars button').classList.add('sel');
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1700)}
$('go').onclick=async()=>{if(!$('nm').value.trim()||!$('tr').value)return alert('Informe nome e turma.');$('go').disabled=true;$('load').textContent='Preparando a escola...';try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');init();$('login').style.display='none';['hud','map'].forEach(x=>$(x).style.display=x==='hud'?'flex':'block');$('joy').style.display='block';$('cross').style.display='block';$('who').textContent=$('nm').value.trim()+' • '+$('tr').value;socket.emit('join',{name:$('nm').value.trim(),turma:$('tr').value,avatar});started=true;toast('🔔 Bem-vindo à MATH SCHOOL!')}catch(e){alert('Erro ao carregar o 3D. Recarregue a página.');$('go').disabled=false}};
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.78});function box(x,y,z,w,h,d,c,solid=false){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);scene.add(m);if(solid)walls.push(new THREE.Box3().setFromObject(m));return m}
function sign(txt,x,y,z,c='#14557a',sx=5.5){let cv=document.createElement('canvas');cv.width=640;cv.height=150;let g=cv.getContext('2d');g.fillStyle=c;g.fillRect(0,0,640,150);g.fillStyle='white';g.font='bold 43px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,320,75);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv)}));s.position.set(x,y,z);s.scale.set(sx,1.3,1);scene.add(s);return s}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc7ee);scene.fog=new THREE.Fog(0x8bc7ee,55,115);cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,160);cam.position.set(0,1.65,39);ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,1.25));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=false;document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x607050,2.7));let sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(20,30,25);scene.add(sun);school();controls();ren.setAnimationLoop(loop)}
function school(){box(0,-.25,0,90,.5,105,0x6f9b59);box(0,0,12,18,.18,64,0xd8d2c5);box(-9,2,12,.35,4,64,0xf0ede5,true);box(9,2,12,.35,4,64,0xf0ede5,true);box(0,4,12,18,.25,64,0xe1ddd4);box(-5.2,1.6,43,.35,3.2,9,0x31404a,true);box(5.2,1.6,43,.35,3.2,9,0x31404a,true);box(0,3.5,43,11,.5,.5,0x174b6d);sign('MATH SCHOOL',0,5,43,'#174b6d',8);sign('ENTRADA PRINCIPAL',0,2.8,36,'#1b668d',7);for(let z=32;z>-17;z-=8){box(-8.7,1.5,z,.18,2.6,3.1,0x59a9cf);box(8.7,1.5,z,.18,2.6,3.1,0x59a9cf)}
room(-1,20,'SALA 1 • PA','#17643e',0x17643e);room(1,7,'SALA 2 • PG','#63347b',0x63347b);sideRoom(-1,-7,'📚 BIBLIOTECA','#76501e');sideRoom(1,-7,'💻 LABORATÓRIO','#185f74');sign('🏀 PÁTIO',0,2.8,-18,'#a44e1d',5);box(0,0,-27,24,.15,17,0xb97843);for(let x=-9;x<=9;x+=6)box(x,1,-31,.12,2,5,0xffffff);box(0,.05,-27,12,.04,7,0x517b3c);box(0,.07,-27,6,.04,.08,0xffffff);
for(let z=31;z>-15;z-=7){box(-7.8,.35,z,1.2,.7,.45,0x5a3b25);box(7.8,.35,z,1.2,.7,.45,0x5a3b25)}
dir=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(.75,1.05,.42),M(0x1d3150));body.position.y=1.05;dir.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.34,14,10),M(0xc78e69));head.position.y=1.85;dir.add(head);let legs=new THREE.Mesh(new THREE.BoxGeometry(.62,.75,.3),M(0x202020));legs.position.y=.35;dir.add(legs);scene.add(dir);dirTag=sign('DIRETOR',0,2.5,5,'#8b2222',3.4)}
function room(side,z,title,col,accent){let x=side*14;box(x,0,z,10,.15,11,0xd4cec1);box(side*18.8,2,z,.3,4,11,0xeeeae1,true);box(x,2,z-5.5,10,4,.3,0xeeeae1,true);box(x,2,z+5.5,10,4,.3,0xeeeae1,true);box(side*9.15,2,z-4,.3,4,3,0xeeeae1,true);box(side*9.15,2,z+4,.3,4,3,0xeeeae1,true);sign(title,side*9,3,z,col,5.2);box(side*18.55,2,z,0.08,2.3,5,accent);for(let zz=z-3;zz<=z+3;zz+=3)for(let a=11;a<=16;a+=2.5){box(side*a,.42,zz,1.65,.75,1,0x9a6c42);box(side*a,.95,zz+.38,1.65,.65,.12,0x36556b)}}
function sideRoom(side,z,title,col){let x=side*14;box(x,0,z,10,.15,10,0xd4cec1);box(side*18.8,2,z,.3,4,10,0xeeeae1,true);box(x,2,z-5,10,4,.3,0xeeeae1,true);box(x,2,z+5,10,4,.3,0xeeeae1,true);sign(title,side*9,3,z,col,5)}
const Q={PA:['📘 MISSÃO: PA','Na PA (4, 7, 10, 13, ...), qual é o 12º termo?',['34','37','40','43'],'37',30],PG:['📗 MISSÃO: PG','Na PG (3, 6, 12, 24, ...), qual é o 7º termo?',['96','144','192','384'],'192',30],DIR:['🎓 DESAFIO DO DIRETOR','Uma PA tem a₁=2 e razão 4. Qual é a soma dos 6 primeiros termos?',['62','68','72','76'],'72',50]};
function challenge(k){let q=Q[k];$('mt').textContent=q[0];$('mq').textContent=q[1];$('opts').innerHTML='';q[2].forEach(v=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>{if(v===q[3]){xp+=q[4];$('xpv').textContent=xp+' XP';socket.emit('xp',q[4]);toast('✅ +'+q[4]+' XP');$('modal').style.display='none'}else toast('❌ Tente novamente')};$('opts').appendChild(b)});$('modal').style.display='flex'}$('close').onclick=()=>$('modal').style.display='none';$('action').onclick=()=>inter&&challenge(inter);
let keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);function controls(){let look=false,lx=0,ly=0;ren.domElement.onpointerdown=e=>{if(e.clientX>innerWidth*.35){look=true;lx=e.clientX;ly=e.clientY}};ren.domElement.onpointermove=e=>{if(look){yaw-=(e.clientX-lx)*.004;pitch=Math.max(-.9,Math.min(.9,pitch-(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY}};ren.domElement.onpointerup=()=>look=false;function jm(e){let a=$('joy').getBoundingClientRect(),x=e.clientX-a.left-58,y=e.clientY-a.top-58,m=Math.min(40,Math.hypot(x,y)),an=Math.atan2(y,x);jx=Math.cos(an)*m/40;jy=Math.sin(an)*m/40;$('stick').style.transform=`translate(${jx*31}px,${jy*31}px)`}$('joy').onpointerdown=e=>{$('joy').setPointerCapture(e.pointerId);jm(e)};$('joy').onpointermove=e=>{if(e.buttons)jm(e)};$('joy').onpointerup=()=>{jx=jy=0;$('stick').style.transform=''}}
function collides(x,z){let p=new THREE.Vector3(x,1,z);return walls.some(b=>b.clone().expandByScalar(.35).containsPoint(p))}
function zone(){let x=cam.position.x,z=cam.position.z,r='Corredor';if(z>34)r='Portaria';if(x<-9&&z>14&&z<26)r='Sala 1 • PA';if(x>9&&z>1&&z<13)r='Sala 2 • PG';if(x<-9&&z>-12&&z<-2)r='Biblioteca';if(x>9&&z>-12&&z<-2)r='Laboratório';if(z<-18)r='Pátio';$('where').textContent=r;inter=null;let h='';if(r.includes('PA')){inter='PA';h='📘 INICIAR MISSÃO DE PA'}if(r.includes('PG')){inter='PG';h='📗 INICIAR MISSÃO DE PG'}if(Math.hypot(cam.position.x-dir.position.x,cam.position.z-dir.position.z)<3){inter='DIR';h='🎓 FALAR COM O DIRETOR'}$('hint').textContent=h;$('hint').style.display=h?'block':'none';$('action').style.display=h?'block':'none';return r}
function loop(ms){let dt=Math.min((ms-last)/1000||.016,.04);last=ms;t+=dt;dir.position.set(Math.sin(t*.4)*5,0,5+Math.sin(t*.19)*17);dirTag.position.set(dir.position.x,2.5,dir.position.z);if(started){let f=(keys.w||0)-(keys.s||0)-jy,s=(keys.d||0)-(keys.a||0)+jx,sp=5*dt,nx=cam.position.x+(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp,nz=cam.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;if(nx>-19&&nx<19&&nz>-36&&nz<43&&!collides(nx,nz)){cam.position.x=nx;cam.position.z=nz}cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=pitch;let r=zone();if(ms%250<20)socket.emit('state',{x:cam.position.x,z:cam.position.z,room:r})}ren.render(scene,cam)}
addEventListener('resize',()=>{if(cam){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)}})
</script></body></html>
