<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MATH SCHOOL 3D V3</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#081827;color:white;touch-action:none}
canvas{display:block}#login{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(#123d5b,#071827)}
.card{width:min(92vw,520px);padding:28px;background:#071c2b;border:3px solid #48b6ff;border-radius:25px;box-shadow:0 18px 60px #0008}.card h1{color:#ffd047;font-size:clamp(30px,7vw,52px);margin:0 0 10px}.card input{width:100%;padding:16px;border-radius:12px;border:0;font-size:20px;margin:12px 0}.card button,.action{border:0;border-radius:12px;background:#f4aa27;color:#111;font-weight:800;padding:16px;font-size:18px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}.box{position:absolute;background:#071c2bd9;border:1px solid #ffffff30;border-radius:16px;padding:12px 16px;font-weight:bold}.status{left:16px;top:16px}.xp{right:16px;top:16px;font-size:22px}.mission{left:50%;top:15px;transform:translateX(-50%);max-width:45vw;text-align:center}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:42px}
#joy{pointer-events:auto;position:absolute;left:22px;bottom:28px;width:140px;height:140px;border:3px solid #fff5;border-radius:50%;background:#fff1}#knob{position:absolute;width:62px;height:62px;border-radius:50%;background:#ffffffaa;left:36px;top:36px}
#look{pointer-events:auto;position:absolute;right:0;bottom:0;width:48%;height:72%}
#interact{pointer-events:auto;position:absolute;right:24px;bottom:42px;border:0;border-radius:50%;width:84px;height:84px;background:#f4aa27dd;font-weight:bold;display:none}
#dialog{position:fixed;z-index:12;left:50%;bottom:24px;transform:translateX(-50%);width:min(92vw,620px);background:#071c2bf2;border:2px solid #48b6ff;border-radius:18px;padding:18px;display:none}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}#answers button{padding:12px;border:0;border-radius:9px;font-weight:bold}.small{opacity:.8;font-size:13px}
@media(max-width:650px){.mission{top:105px;max-width:75vw;font-size:12px}.box{padding:9px 12px}.xp{font-size:17px}}
</style></head><body>
<div id="login"><div class="card"><h1>🏫 MATH SCHOOL 3D <small>V3</small></h1><p>Entre na escola, encontre o diretor e escolha sua sala.</p><input id="name" placeholder="Nome do aluno"><input id="turma" placeholder="Turma (ex.: 208)"><button onclick="start()">ENTRAR NA ESCOLA</button></div></div>
<div id="hud"><div class="box status" id="status">Aluno<br>Entrada</div><div class="box xp" id="xp">⭐ 50 XP</div><div class="box mission" id="mission">MISSÃO: encontre o Diretor ou entre em uma sala.</div><div class="cross">+</div><div id="joy"><div id="knob"></div></div><div id="look"></div><button id="interact">FALAR</button></div>
<div id="dialog"><b id="dt">Diretor</b><p id="dq"></p><div id="answers"></div><div class="small">Responda para ganhar XP.</div></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const socket=io(); let started=false,xp=50,name='Aluno',turma='---',near=null,challenge=null;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x86b9dc); scene.fog=new THREE.Fog(0x86b9dc,45,105);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,140); camera.position.set(0,1.65,30);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=false; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f5ff,0x66704f,2.2)); const sun=new THREE.DirectionalLight(0xffffff,1.3);sun.position.set(12,25,10);scene.add(sun);
const mat=(c)=>new THREE.MeshLambertMaterial({color:c}); const coll=[];
function box(x,y,z,w,h,d,c,collision=true){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);scene.add(m);if(collision)coll.push(new THREE.Box3().setFromObject(m));return m}
function sign(text,x,y,z,rot=0,color='#14334a'){let cv=document.createElement('canvas');cv.width=512;cv.height=128;let g=cv.getContext('2d');g.fillStyle=color;g.fillRect(0,0,512,128);g.fillStyle='white';g.font='bold 42px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,64);let t=new THREE.CanvasTexture(cv),m=new THREE.Mesh(new THREE.PlaneGeometry(5,1.25),new THREE.MeshBasicMaterial({map:t}));m.position.set(x,y,z);m.rotation.y=rot;scene.add(m);return m}
// school shell
box(0,-.25,0,44,.5,78,0xd7d0bd,false); box(0,5,-38,44,10,.4,0xe8e4d7); box(-22,5,0,.4,10,78,0xe8e4d7);box(22,5,0,.4,10,78,0xe8e4d7);
for(let z=-30;z<=25;z+=11){box(-10.5,2.5,z,.25,5,8,0xf1eee4);box(10.5,2.5,z,.25,5,8,0xf1eee4)}
// central hall walls / doors
for(let z=-31;z<=22;z+=11){box(-15.8,2.5,z,12,.3,.3,0x4f7c91,false);box(15.8,2.5,z,12,.3,.3,0x4f7c91,false)}
// rooms labels
sign('SALA 1 • PA',-10.25,3.6,20,Math.PI/2,'#1478a5'); sign('SALA 2 • PG',10.25,3.6,20,-Math.PI/2,'#58a72c');
sign('📚 BIBLIOTECA',-10.25,3.6,9,Math.PI/2,'#8a4aa8');sign('🔬 LABORATÓRIO',10.25,3.6,9,-Math.PI/2,'#287a83');
sign('DIREÇÃO',0,3.6,-37.75,0,'#9a4242');sign('MATH SCHOOL',0,6.5,-37.7,0,'#164e70');
// doors visual
box(-10.35,1.35,20,0.18,2.7,2.2,0x2e83aa,false);box(10.35,1.35,20,.18,2.7,2.2,0x68aa3b,false);
box(-10.35,1.35,9,.18,2.7,2.2,0x8452a0,false);box(10.35,1.35,9,.18,2.7,2.2,0x3c8d91,false);
// furniture
function desk(x,z,side){box(x,.65,z,2.2,.12,1.1,0x9a633b,false);box(x-.8,.3,z,.12,.6,.12,0x463426,false);box(x+.8,.3,z,.12,.6,.12,0x463426,false)}
for(let z=15;z<=26;z+=3.5)for(let x of [-17,-14,-7,-4])desk(x,z);
for(let z=15;z<=26;z+=3.5)for(let x of [4,7,14,17])desk(x,z);
// PA board / PG board
box(-16,2.4,28.8,7,2.6,.15,0x244a38,false); sign('PA: an = a1 + (n−1)r',-16,2.4,28.7,0,'#244a38');
box(16,2.4,28.8,7,2.6,.15,0x244a38,false); sign('PG: an = a1 · qⁿ⁻¹',16,2.4,28.7,0,'#244a38');
// library shelves
for(let z=3;z<13;z+=3)box(-17,1.3,z,5,2.6,.5,0x734b2f,false);
// lab benches
for(let z=3;z<13;z+=3)box(16,.8,z,6,1.6,1.1,0xd7d7d7,false);
// courtyard at front
box(0,.01,35,20,.03,6,0x6c9c61,false);sign('🏀 PÁTIO / QUADRA',0,2.8,37.8,0,'#b67823');
// director
const director=new THREE.Group(); const body=box(0,0,0,1.0,1.65,.6,0x18365c,false); body.position.y=.95; const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),mat(0xd39a72));head.position.y=2;director.add(body);director.add(head);director.position.set(0,0,-27);scene.add(director);
const label=sign('DIRETOR',0,0,0,0,'#8f3c3c'); label.scale.set(.45,.45,.45); director.add(label); label.position.set(0,2.75,0);
let dirT=0;
// interactions zones
const zones=[{type:'PA',p:new THREE.Vector3(-9,0,20)},{type:'PG',p:new THREE.Vector3(9,0,20)},{type:'Biblioteca',p:new THREE.Vector3(-9,0,9)},{type:'Laboratório',p:new THREE.Vector3(9,0,9)}];
const questions={
Diretor:[['Diretor: antes de entrar, complete: 2, 5, 8, 11, ...',['14','13','15','16'],'14']],
PA:[['Sala de PA • Qual é o 10º termo de 2, 5, 8, ...?',['26','29','30','32'],'29']],
PG:[['Sala de PG • Qual é o 6º termo de 2, 4, 8, ...?',['32','64','48','128'],'64']],
Biblioteca:[['Biblioteca • Em uma PA, a diferença constante é chamada de...',['razão','quociente','produto','expoente'],'razão']],
Laboratório:[['Laboratório • Se a₁=3 e q=2, então a₄ vale...',['12','18','24','27'],'24']]
};
function showChallenge(type){challenge=questions[type][0];document.getElementById('dialog').style.display='block';document.getElementById('dt').textContent=type;document.getElementById('dq').textContent=challenge[0];let a=document.getElementById('answers');a.innerHTML='';challenge[1].forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(v);a.appendChild(b)})}
function answer(v){if(v===challenge[2]){xp+=25;document.getElementById('mission').textContent='✅ CORRETO! +25 XP. Continue explorando.';socket.emit('xp',xp)}else document.getElementById('mission').textContent='❌ Tente novamente. Observe a sequência.';document.getElementById('xp').textContent='⭐ '+xp+' XP';document.getElementById('dialog').style.display='none'}
window.start=()=>{name=document.getElementById('name').value.trim()||'Aluno';turma=document.getElementById('turma').value.trim()||'---';document.getElementById('login').style.display='none';document.getElementById('status').innerHTML=name+' • '+turma+'<br>Corredor';socket.emit('join',{name,room:turma});started=true}
let yaw=0,pitch=0,moveX=0,moveY=0;const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jid=null,jc={x:70,y:70};
function joymove(e){let t=[...e.changedTouches].find(t=>t.identifier===jid);if(!t)return;let r=joy.getBoundingClientRect(),dx=t.clientX-(r.left+70),dy=t.clientY-(r.top+70),len=Math.hypot(dx,dy),m=Math.min(48,len),nx=len?dx/len:0,ny=len?dy/len:0;knob.style.transform=`translate(${nx*m}px,${ny*m}px)`;moveX=nx*(m/48);moveY=ny*(m/48)}
joy.addEventListener('touchstart',e=>{jid=e.changedTouches[0].identifier;joymove(e)},{passive:false});joy.addEventListener('touchmove',e=>{e.preventDefault();joymove(e)},{passive:false});joy.addEventListener('touchend',()=>{jid=null;moveX=moveY=0;knob.style.transform='translate(0,0)'});
let lx,ly;const look=document.getElementById('look');look.addEventListener('touchstart',e=>{lx=e.changedTouches[0].clientX;ly=e.changedTouches[0].clientY},{passive:false});look.addEventListener('touchmove',e=>{e.preventDefault();let t=e.changedTouches[0];yaw-=(t.clientX-lx)*.004;pitch-=(t.clientY-ly)*.003;pitch=Math.max(-1.1,Math.min(1.1,pitch));lx=t.clientX;ly=t.clientY},{passive:false});
document.getElementById('interact').onclick=()=>{if(near)showChallenge(near)};
function blocked(pos){let p=new THREE.Box3(new THREE.Vector3(pos.x-.28,.1,pos.z-.28),new THREE.Vector3(pos.x+.28,1.9,pos.z+.28));return coll.some(c=>p.intersectsBox(c))}
function update(dt){camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;let f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let np=camera.position.clone().addScaledVector(f,-moveY*dt*5).addScaledVector(r,moveX*dt*5);np.x=Math.max(-21.3,Math.min(21.3,np.x));np.z=Math.max(-37,Math.min(38,np.z));if(!blocked(np))camera.position.copy(np);
dirT+=dt;director.position.x=Math.sin(dirT*.55)*5;director.position.z=-25+Math.cos(dirT*.55)*3;director.rotation.y=dirT*.55;
let d=camera.position.distanceTo(director.position),best=d<3?'Diretor':null,bd=d;for(let z of zones){let dd=Math.hypot(camera.position.x-z.p.x,camera.position.z-z.p.z);if(dd<3&&dd<bd){best=z.type;bd=dd}}
near=best;let ib=document.getElementById('interact');ib.style.display=near?'block':'none';ib.textContent=near==='Diretor'?'FALAR':'ENTRAR';
let area='Corredor';if(camera.position.x<-10)area=camera.position.z>14?'Sala PA':camera.position.z>3?'Biblioteca':'Ala esquerda';if(camera.position.x>10)area=camera.position.z>14?'Sala PG':camera.position.z>3?'Laboratório':'Ala direita';document.getElementById('status').innerHTML=name+' • '+turma+'<br>'+area}
let last=performance.now();function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;if(started)update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
