*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:#111;color:white;touch-action:none}canvas{display:block}#login{position:fixed;inset:0;z-index:30;background:linear-gradient(#123b60,#08131e);display:flex;align-items:center;justify-content:center}.card{width:min(430px,92vw);padding:24px;background:#0b1927ee;border:2px solid #55b8ff;border-radius:20px}h1{color:#ffd34d}input,select,button{width:100%;padding:14px;margin:6px 0;border-radius:11px;border:1px solid #567;background:#14283a;color:white;font-size:16px}button{background:#f0a72f;color:#111;font-weight:bold;border:0}.avs{display:flex;gap:8px}.avs button{font-size:22px}#hud{position:fixed;z-index:10;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#07131ddd;padding:9px 12px;border-radius:12px}#cross{position:fixed;z-index:8;left:50%;top:50%;font-size:25px}#joy{position:fixed;z-index:12;left:24px;bottom:25px;width:110px;height:110px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff40}#stick{position:absolute;width:46px;height:46px;left:30px;top:30px;border-radius:50%;background:#ffffff88}#action{position:fixed;z-index:12;right:24px;bottom:35px;width:85px;height:85px;border-radius:50%;display:none}#hint{position:fixed;z-index:12;left:50%;bottom:130px;transform:translateX(-50%);background:#07131ddd;padding:10px;border-radius:10px;display:none}#modal{position:fixed;inset:0;z-index:25;background:#000b;display:none;align-items:center;justify-content:center}.mc{width:min(480px,92vw);background:#102536;padding:20px;border:2px solid #f0a72f;border-radius:18px}.mc button{background:#1c405a;color:white;border:1px solid #6aa}#toast{position:fixed;z-index:40;top:70px;left:50%;transform:translateX(-50%);background:#16472b;padding:12px;display:none;border-radius:10px}
</style></head><body><div id="login"><div class="card"><h1>🏫 MATH SCHOOL 3D</h1><p>Explore a escola. Entre nas salas. Supere os desafios.</p><input id="name" placeholder="Nome do aluno"><select id="turma"><option value="">Turma</option><option>206</option><option>207</option><option>208</option></select><div class="avs"><button>🔵</button><button>🟢</button><button>🟣</button><button>🟠</button></div><button id="enter">ENTRAR NA ESCOLA</button></div></div><div id="hud"><div class="pill"><b id="who">Aluno</b><br><span id="where">Entrada</span></div><div class="pill">⭐ <b id="xp">0 XP</b></div></div><div id="cross">+</div><div id="hint"></div><div id="joy"><div id="stick"></div></div><button id="action">AÇÃO</button><div id="toast"></div><div id="modal"><div class="mc"><h2 id="mt"></h2><p id="mq"></p><div id="opts"></div><button onclick="document.getElementById('modal').style.display='none'">Fechar</button></div></div>
<script type="module">import * as THREE from'three';const socket=io(),scene=new THREE.Scene();scene.background=new THREE.Color(0x87b9dc);scene.fog=new THREE.Fog(0x87b9dc,45,100);const cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,150);cam.position.set(0,1.65,25);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x556644,2.5));let dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(15,25,10);scene.add(dl);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});function box(x,y,z,w,h,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);scene.add(m);return m}function label(t,x,y,z,b='#17486a'){let c=document.createElement('canvas');c.width=512;c.height=128;let q=c.getContext('2d');q.fillStyle=b;q.fillRect(0,0,512,128);q.fillStyle='white';q.font='bold 43px Arial';q.textAlign='center';q.textBaseline='middle';q.fillText(t,256,64);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));s.position.set(x,y,z);s.scale.set(5.3,1.3,1);scene.add(s)}
box(0,-.2,0,70,.4,90,0x6e9255);box(0,0,0,18,.2,60,0xcac5b9);box(-9,2,0,.4,4,60,0xeee8dc);box(9,2,0,.4,4,60,0xeee8dc);box(0,4,0,18,.3,60,0xdad5ca);label('MATH SCHOOL',0,3,28);label('HALL • RANKING',0,2.6,18);
function room(side,z,title,col){box(side*14,0,z,10,.2,12,0xd6d0c3);box(side*18.8,2,z,.4,4,12,0xeee8dc);box(side*14,2,z-6,10,4,.3,0xeee8dc);box(side*14,2,z+6,10,4,.3,0xeee8dc);box(side*9.2,2,z-4.5,.4,4,3,0xeee8dc);box(side*9.2,2,z+4.5,.4,4,3,0xeee8dc);label(title,side*9,3,z,col);for(let dz=-3;dz<=3;dz+=3)for(let xx=11;xx<=16;xx+=2.5)box(side*xx,.45,z+dz,1.7,.8,1.1,0x8b633f)}room(-1,6,'SALA 1 • PA','#176447');room(1,-8,'SALA 2 • PG','#63327a');label('BIBLIOTECA • EM BREVE',-8.8,2.6,-22,'#70491f');
const director=new THREE.Group();let bo=new THREE.Mesh(new THREE.BoxGeometry(.75,1.05,.42),mat(0x26334a));bo.position.y=1.05;director.add(bo);let he=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),mat(0xc98e68));he.position.y=1.85;director.add(he);let le=new THREE.Mesh(new THREE.BoxGeometry(.62,.75,.32),mat(0x222222));le.position.y=.35;director.add(le);scene.add(director);let dlab=label('DIRETOR',0,2.5,0,'#8b1e1e');
let started=false,yaw=0,pitch=0,jx=0,jy=0,xp=0,inter=null,keys={},T=0;const qs={PA:['📘 Sala de PA','Na PA (3,7,11,15,...), qual é o 10º termo?',['35','39','43','47'],'39',30],PG:['📗 Sala de PG','Na PG (2,6,18,54,...), qual é o 6º termo?',['162','324','486','729'],'486',30],DIR:['🎓 Diretor','Uma PA tem a₁=5 e razão 3. Qual a soma dos 5 primeiros termos?',['45','50','55','60'],'55',50]};
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}function challenge(k){let q=qs[k];mt.textContent=q[0];mq.textContent=q[1];opts.innerHTML='';q[2].forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(v===q[3]){xp+=q[4];document.getElementById('xp').textContent=xp+' XP';socket.emit('awardXP',q[4]);toast('✅ Correto! +'+q[4]+' XP');modal.style.display='none'}else toast('❌ Tente novamente')};opts.appendChild(b)});modal.style.display='flex'}
enter.onclick=()=>{let n=name.value.trim(),t=turma.value;if(!n||!t)return alert('Informe nome e turma.');started=true;login.style.display='none';who.textContent=n+' • '+t;socket.emit('joinSchool',{name:n,turma:t})};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let look=false,lx=0,ly=0;r.domElement.onpointerdown=e=>{if(e.clientX>innerWidth*.35){look=true;lx=e.clientX;ly=e.clientY}};r.domElement.onpointermove=e=>{if(look){yaw-=(e.clientX-lx)*.004;pitch=Math.max(-1.1,Math.min(1.1,pitch-(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY}};r.domElement.onpointerup=()=>look=false;function jm(e){let a=joy.getBoundingClientRect(),x=e.clientX-a.left-55,y=e.clientY-a.top-55,m=Math.min(40,Math.hypot(x,y)),an=Math.atan2(y,x);jx=Math.cos(an)*m/40;jy=Math.sin(an)*m/40;stick.style.transform=`translate(${jx*30}px,${jy*30}px)`}joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);jm(e)};joy.onpointermove=e=>{if(e.buttons)jm(e)};joy.onpointerup=()=>{jx=jy=0;stick.style.transform=''};action.onclick=()=>inter&&challenge(inter);
function zone(){let x=cam.position.x,z=cam.position.z,rm=z>18?'Entrada / Hall':'Corredor';if(x<-9&&z>0&&z<12)rm='Sala 1 • PA';if(x>9&&z>-14&&z<-2)rm='Sala 2 • PG';where.textContent=rm;inter=null;let h='';if(rm.includes('PA')){inter='PA';h='📘 AÇÃO: desafio de PA'}if(rm.includes('PG')){inter='PG';h='📗 AÇÃO: desafio de PG'}if(cam.position.distanceTo(new THREE.Vector3(director.position.x,1.6,director.position.z))<3){inter='DIR';h='🎓 AÇÃO: falar com o Diretor'}hint.textContent=h;hint.style.display=h?'block':'none';action.style.display=h?'block':'none';return rm}
let cl=new THREE.Clock();function loop(){let d=Math.min(cl.getDelta(),.04);T+=d;director.position.set(Math.sin(T*.45)*5.5,0,-1+Math.sin(T*.22)*13);dlab.position.set(director.position.x,2.5,director.position.z);if(started){let f=(keys.w||0)-(keys.s||0)-jy,s=(keys.d||0)-(keys.a||0)+jx,sp=5*d;let nx=cam.position.x+(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp,nz=cam.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;if(nx>-18&&nx<18&&nz>-29&&nz<29){cam.position.x=nx;cam.position.z=nz}cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=pitch;socket.emit('move',{x:cam.position.x,z:cam.position.z,room:zone()})}r.render(scene,cam)}r.setAnimationLoop(loop);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
