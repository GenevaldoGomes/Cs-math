<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MATH SCHOOL 3D v1.1</title><script src="/socket.io/socket.io.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07131e;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{position:fixed;inset:0;display:block}.login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:linear-gradient(#164b73,#07131e)}.card{width:min(440px,92vw);background:#091b2aee;border:2px solid #62bdff;border-radius:20px;padding:24px}h1{color:#ffd044;font-size:34px}.card input,.card select,.card button{width:100%;padding:15px;margin:7px 0;border-radius:12px;font-size:17px}.card input,.card select{background:#f4f7fb;color:#111;border:0}.card button,.action,.opt{border:0;background:#f5a623;color:#111;font-weight:800}.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.avatars button{font-size:26px}.avatars button.sel{outline:3px solid #fff}.hud{position:fixed;z-index:20;left:10px;right:10px;top:10px;display:none;justify-content:space-between;pointer-events:none}.pill{background:#07131edd;padding:9px 12px;border-radius:11px}.joy{position:fixed;z-index:25;bottom:25px;left:22px;width:115px;height:115px;border-radius:50%;border:2px solid #fff5;background:#fff2;display:none}.stick{position:absolute;left:34px;top:34px;width:45px;height:45px;border-radius:50%;background:#fffb}.action{position:fixed;z-index:25;right:22px;bottom:35px;width:92px;height:92px;border-radius:50%;display:none}.hint{position:fixed;z-index:24;bottom:135px;left:50%;transform:translateX(-50%);background:#07131eee;padding:10px 14px;border-radius:10px;display:none;text-align:center}.cross{position:fixed;z-index:19;left:50%;top:50%;display:none;font-size:25px}.modal{position:fixed;inset:0;z-index:40;background:#000c;display:none;align-items:center;justify-content:center}.box{width:min(480px,92vw);background:#10283b;border:2px solid #f5a623;border-radius:18px;padding:20px}.opt{width:100%;padding:13px;margin:5px;border-radius:9px;background:#1d4b68;color:#fff}.toast,.error{position:fixed;z-index:70;left:50%;transform:translateX(-50%);padding:12px;border-radius:10px;display:none}.toast{top:70px;background:#1c6538}.error{bottom:15px;background:#8b2020;width:90%;text-align:center}</style></head><body>
<div class="login" id="login"><div class="card"><h1>🏫 MATH SCHOOL 3D</h1><p>Explore a escola. Entre nas salas. Supere os desafios.</p><input id="studentName" placeholder="NOME DO ALUNO"><select id="studentClass"><option value="">SELECIONE A TURMA</option><option>206</option><option>207</option><option>208</option></select><div class="avatars"><button data-a="0">🔵</button><button data-a="1">🟢</button><button data-a="2">🟣</button><button data-a="3">🟠</button></div><button id="enterBtn">ENTRAR NA ESCOLA</button><small id="loadingMsg"></small></div></div>
<div class="hud" id="hud"><div class="pill"><b id="who">Aluno</b><br><span id="where">Entrada</span></div><div class="pill">⭐ <b id="xp">0 XP</b></div></div><div class="cross" id="cross">+</div><div class="joy" id="joy"><div class="stick" id="stick"></div></div><button class="action" id="action">AÇÃO</button><div class="hint" id="hint"></div><div class="toast" id="toast"></div><div class="error" id="error"></div><div class="modal" id="modal"><div class="box"><h2 id="mt"></h2><p id="mq"></p><div id="opts"></div><button class="opt" id="closeModal">FECHAR</button></div></div>
<script>
let THREE=null,renderer=null,scene=null,camera=null,director=null,directorTag=null,started=false,avatar=0,xpN=0,yaw=0,pitch=0,jx=0,jy=0,interact=null,t=0,lastState=0;const socket=io();
const $=id=>document.getElementById(id);document.querySelectorAll('.avatars button').forEach((b,i)=>b.onclick=()=>{avatar=i;document.querySelectorAll('.avatars button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});document.querySelector('.avatars button').classList.add('sel');
function fail(m){$('error').textContent='⚠️ '+m;$('error').style.display='block';$('loadingMsg').textContent='';}
function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1700)}
async function loadThree(){if(THREE)return true;try{$('loadingMsg').textContent='Carregando ambiente 3D...';THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');return true}catch(e){console.error(e);fail('Não foi possível carregar o motor 3D. Verifique a internet e recarregue a página.');return false}}
$('enterBtn').onclick=async()=>{const n=$('studentName').value.trim(),c=$('studentClass').value;if(!n)return alert('Digite o nome do aluno.');if(!c)return alert('Selecione a turma.');$('enterBtn').disabled=true;if(!(await loadThree())){$('enterBtn').disabled=false;return}try{init3D();$('login').style.display='none';$('hud').style.display='flex';$('joy').style.display='block';$('cross').style.display='block';$('who').textContent=n+' • '+c;started=true;socket.emit('joinSchool',{name:n,turma:c,avatar});toast('🏫 Bem-vindo à MATH SCHOOL!')}catch(e){console.error(e);fail('Erro ao iniciar a escola 3D: '+e.message);$('enterBtn').disabled=false}};
function init3D(){scene=new THREE.Scene();scene.background=new THREE.Color(0x88bddd);scene.fog=new THREE.Fog(0x88bddd,45,100);camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,140);camera.position.set(0,1.65,25);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);document.body.insertBefore(renderer.domElement,document.body.firstChild);scene.add(new THREE.HemisphereLight(0xffffff,0x4c5c40,2.5));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(15,25,12);scene.add(sun);buildSchool();bindControls();renderer.setAnimationLoop(loop)}
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});function cube(x,y,z,w,h,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);scene.add(m);return m}
function sign(text,x,y,z,color='#195273',rot=0){let c=document.createElement('canvas');c.width=640;c.height=150;let g=c.getContext('2d');g.fillStyle=color;g.fillRect(0,0,c.width,c.height);g.fillStyle='#fff';g.font='bold 46px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(text,320,75);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));s.position.set(x,y,z);s.scale.set(6.2,1.45,1);scene.add(s);return s}
function buildSchool(){cube(0,-.15,0,70,.3,80,0x659353);cube(0,0,0,18,.2,58,0xc9c3b5);cube(-9,2,0,.35,4,58,0xeae5da);cube(9,2,0,.35,4,58,0xeae5da);cube(0,4,0,18,.25,58,0xd9d4c9);sign('MATH SCHOOL',0,3.05,27,'#123e61');sign('HALL CENTRAL',0,2.8,18,'#1a5575');makeRoom(-1,7,'SALA 1 • PA','#17623f');makeRoom(1,-8,'SALA 2 • PG','#62347b');sign('BIBLIOTECA • EM BREVE',-8.7,2.7,-22,'#765022');director=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(.75,1.05,.42),mat(0x26364f));body.position.y=1.05;director.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),mat(0xc78c68));head.position.y=1.83;director.add(head);let legs=new THREE.Mesh(new THREE.BoxGeometry(.62,.75,.3),mat(0x202020));legs.position.y=.35;director.add(legs);scene.add(director);directorTag=sign('DIRETOR',0,2.45,0,'#8c2525')}
function makeRoom(side,z,title,col){cube(side*14,0,z,10,.2,12,0xd2cbbd);cube(side*18.8,2,z,.35,4,12,0xeee8dd);cube(side*14,2,z-6,10,4,.3,0xeee8dd);cube(side*14,2,z+6,10,4,.3,0xeee8dd);cube(side*9.2,2,z-4.6,.35,4,2.8,0xeee8dd);cube(side*9.2,2,z+4.6,.35,4,2.8,0xeee8dd);sign(title,side*9,3,z,col);for(let dz=-3;dz<=3;dz+=3)for(let a=11;a<=16;a+=2.5)cube(side*a,.45,z+dz,1.7,.8,1.05,0x8a633f)}
const Q={PA:{t:'📘 SALA DE PA',q:'Na PA (3, 7, 11, 15, ...), qual é o 10º termo?',o:['35','39','43','47'],a:'39',xp:30},PG:{t:'📗 SALA DE PG',q:'Na PG (2, 6, 18, 54, ...), qual é o 6º termo?',o:['162','324','486','729'],a:'486',xp:30},DIR:{t:'🎓 DESAFIO DO DIRETOR',q:'Uma PA tem a₁ = 5 e razão 3. Qual é a soma dos 5 primeiros termos?',o:['45','50','55','60'],a:'55',xp:50}};
function challenge(k){let q=Q[k];$('mt').textContent=q.t;$('mq').textContent=q.q;$('opts').innerHTML='';q.o.forEach(v=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>{if(v===q.a){xpN+=q.xp;$('xp').textContent=xpN+' XP';socket.emit('xp',q.xp);toast('✅ CORRETO! +'+q.xp+' XP');$('modal').style.display='none'}else toast('❌ Resposta incorreta. Tente novamente.')};$('opts').appendChild(b)});$('modal').style.display='flex'}$('closeModal').onclick=()=>$('modal').style.display='none';$('action').onclick=()=>interact&&challenge(interact);
let keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function bindControls(){let looking=false,lx=0,ly=0;renderer.domElement.onpointerdown=e=>{if(e.clientX>innerWidth*.35){looking=true;lx=e.clientX;ly=e.clientY}};renderer.domElement.onpointermove=e=>{if(looking){yaw-=(e.clientX-lx)*.004;pitch=Math.max(-1.05,Math.min(1.05,pitch-(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY}};renderer.domElement.onpointerup=()=>looking=false;function jm(e){let a=$('joy').getBoundingClientRect(),x=e.clientX-a.left-57.5,y=e.clientY-a.top-57.5,m=Math.min(40,Math.hypot(x,y)),an=Math.atan2(y,x);jx=Math.cos(an)*m/40;jy=Math.sin(an)*m/40;$('stick').style.transform=`translate(${jx*31}px,${jy*31}px)`}$('joy').onpointerdown=e=>{$('joy').setPointerCapture(e.pointerId);jm(e)};$('joy').onpointermove=e=>{if(e.buttons)jm(e)};$('joy').onpointerup=()=>{jx=jy=0;$('stick').style.transform=''}}
function currentZone(){let x=camera.position.x,z=camera.position.z,room=z>18?'Entrada / Hall':'Corredor';if(x<-9&&z>1&&z<13)room='Sala 1 • PA';if(x>9&&z>-14&&z<-2)room='Sala 2 • PG';$('where').textContent=room;interact=null;let msg='';if(room.includes('PA')){interact='PA';msg='📘 Resolver desafio de PA'}if(room.includes('PG')){interact='PG';msg='📗 Resolver desafio de PG'}let dx=camera.position.x-director.position.x,dz=camera.position.z-director.position.z;if(Math.hypot(dx,dz)<3.1){interact='DIR';msg='🎓 Falar com o Diretor'}$('hint').textContent=msg;$('hint').style.display=msg?'block':'none';$('action').style.display=msg?'block':'none';return room}
let clock=null;function loop(ms){if(!clock)clock=ms;let dt=Math.min((ms-clock)/1000,.04);clock=ms;t+=dt;director.position.set(Math.sin(t*.42)*5.2,0,-2+Math.sin(t*.2)*13);directorTag.position.set(director.position.x,2.45,director.position.z);if(started){let f=(keys.w||0)-(keys.s||0)-jy,side=(keys.d||0)-(keys.a||0)+jx,sp=5.3*dt;let nx=camera.position.x+(-Math.sin(yaw)*f+Math.cos(yaw)*side)*sp,nz=camera.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*side)*sp;if(nx>-18&&nx<18&&nz>-28&&nz<28){camera.position.x=nx;camera.position.z=nz}camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;let room=currentZone();if(ms-lastState>200){socket.emit('state',{x:camera.position.x,z:camera.position.z,room});lastState=ms}}renderer.render(scene,camera)}
addEventListener('resize',()=>{if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});window.addEventListener('error',e=>fail('Erro do jogo: '+e.message));window.addEventListener('unhandledrejection',e=>fail('Falha ao carregar recurso 3D.'));
</script></body></html>
