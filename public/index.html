const npcs=[];function makeStudent(x,z,c){let g=new THREE.Group();g.add(part(.65,.95,.4,c,0,1.15,0),part(.2,.75,.22,0x263238,-.18,.35,0),part(.2,.75,.22,0x263238,.18,.35,0));let h=new THREE.Mesh(new THREE.SphereGeometry(.3,12,10),mat(0xc98f68));h.position.y=1.9;g.add(h);g.position.set(x,0,z);scene.add(g);npcs.push({g,baseZ:z,s:Math.random()>.5?1:-1});return g}

  box(cx,-.25,cz,18,.5,16,0xe4e0d5,false);box(cx-9,2.5,cz,.3,5,16,0xf5f2e9);box(cx+9,2.5,cz,.3,5,16,0xf5f2e9);box(cx,2.5,cz-8,18,5,.3,0xf5f2e9);box(cx,5.05,cz,18,.2,16,0xf7f4ed,false);

  for(let rz=-3;rz<=4;rz+=3.3)for(let rx=-5;rx<=5;rx+=3.3){desk(cx+rx,cz+rz);}

roomShell(-45,0,'SALA 1 • PROGRESSÃO ARITMÉTICA','#1478a5','PA: aₙ = a₁ + (n−1)r');

function enterRoom(type){currentRoom=type;if(type==='PA'){camera.position.set(-45,1.65,6);yaw=0}else if(type==='PG'){camera.position.set(45,1.65,6);yaw=0}else return showChallenge(type);document.getElementById('status').innerHTML=name+' • '+turma+'<br>Sala '+type;document.getElementById('mission').textContent='📚 SALA '+type+': campanha '+((progress[type]||0)+1)+'/'+questions[type].length+' • aproxime-se do professor.';document.getElementById('exitRoom').style.display='block';near=type;}

['PG • Missão 2: qual a razão de 5, 15, 45, ...?',['2','3','4','5'],'3'],
['PG • Missão 3: qual o 6º termo de 2, 4, 8, ...?',['32','64','48','128'],'64'],
['PG • Missão 4: soma 1 + 2 + 4 + 8 + 16 = ?',['30','31','32','33'],'31']],

function updateScore(){level=Math.floor(xp/100)+1;document.getElementById('xp').textContent='⭐ '+xp+' XP • 🪙 '+coins+' • Nv. '+level;}
function showChallenge(type){challengeType=type;let arr=questions[type],idx=Math.min(progress[type]||0,arr.length-1);challenge=arr[idx];document.getElementById('dialog').style.display='block';document.getElementById('dt').textContent=type+' • '+((progress[type]||0)+1)+'/'+arr.length;document.getElementById('dq').textContent=challenge[0];let a=document.getElementById('answers');a.innerHTML='';challenge[1].forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(v);a.appendChild(b)})}

window.start=()=>{name=document.getElementById('name').value.trim()||'Aluno';turma=document.getElementById('turma').value.trim()||'---';document.getElementById('login').style.display='none';document.getElementById('status').innerHTML=name+' • '+turma+'<br>Corredor';socket.emit('join',{name,room:turma});updateScore();started=true}
let yaw=0,pitch=0,moveX=0,moveY=0;const keys={};const isDesktop=matchMedia('(pointer:fine)').matches;let mouseLocked=false;const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jid=null,jc={x:70,y:70};
function joymove(e){let t=[...e.changedTouches].find(t=>t.identifier===jid);if(!t)return;let r=joy.getBoundingClientRect(),dx=t.clientX-(r.left+70),dy=t.clientY-(r.top+70),len=Math.hypot(dx,dy),m=Math.min(48,len),nx=len?dx/len:0,ny=len?dy/len:0;knob.style.transform=`translate(${nx*m}px,${ny*m}px)`;moveX=nx*(m/48);moveY=ny*(m/48)}
joy.addEventListener('touchstart',e=>{jid=e.changedTouches[0].identifier;joymove(e)},{passive:false});joy.addEventListener('touchmove',e=>{e.preventDefault();joymove(e)},{passive:false});joy.addEventListener('touchend',()=>{jid=null;moveX=moveY=0;knob.style.transform='translate(0,0)'});
let lx,ly;const look=document.getElementById('look');look.addEventListener('touchstart',e=>{lx=e.changedTouches[0].clientX;ly=e.changedTouches[0].clientY},{passive:false});look.addEventListener('touchmove',e=>{e.preventDefault();let t=e.changedTouches[0];yaw-=(t.clientX-lx)*.004;pitch-=(t.clientY-ly)*.003;pitch=Math.max(-1.1,Math.min(1.1,pitch));lx=t.clientX;ly=t.clientY},{passive:false});
function interactNow(){if(!near)return;if((near==='PA'||near==='PG')&&!currentRoom)enterRoom(near);else showChallenge(near)}

  addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'){e.preventDefault();interactNow()}if(e.code==='Escape')keys[e.code]=false});

}

function blocked(pos){let p=new THREE.Box3(new THREE.Vector3(pos.x-.28,.1,pos.z-.28),new THREE.Vector3(pos.x+.28,1.9,pos.z+.28));return coll.some(c=>p.intersectsBox(c))}

let area=currentRoom?'Sala '+currentRoom:'Corredor';if(!currentRoom&&camera.position.x<-10)area=camera.position.z>14?'Entrada Sala PA':camera.position.z>3?'Biblioteca':'Ala esquerda';if(!currentRoom&&camera.position.x>10)area=camera.position.z>14?'Entrada Sala PG':camera.position.z>3?'Laboratório':'Ala direita';document.getElementById('status').innerHTML=name+' • '+turma+'<br>'+area}
